<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="css/Style.css">
</head>
<body>
   <div class="container">
        <h1>Cadastro</h1>
        <form class="formulario-cadastro" action="index.html">

            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Digite seu nome" name="nome" required>

            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Digite seu email" name="email" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" placeholder="Digite sua senha" name="senha" required>
            
            <label for="phone">Telefone:</label>
            <input type="tel" id="phone" placeholder="Digite seu telefone" name="phone" required>
            
              <a href="login.html">volta ao login</a>

            <button type="submit">Cadastrar</button>

        </form>
    </div>
</body>
</html>
