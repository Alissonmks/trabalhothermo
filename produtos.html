<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>
    <link rel="stylesheet" href="css/Style.css">
    <script src="js/script.js" defer></script>
    <script src="js/produtos.js" defer></script>
    <script src="js/carrinho.js" defer></script>
   
 </head>
<body> 
  
<button class="menu-toggle" id="menuToggle"
aria-controls="menuPrincipal"
aria-expanded="false">
Menu
</button>
<nav class="menu-container" id="menuPrincipal">

<div class="menu-direito">
  <a href="index.html" class="logo">
  <img src="img/logo.png" alt="Logo Thermo">
  </a>
 </div>

    <ul class="menu-centro" >
    <li><a href="index.html">Início</a></li>
    <li class="tem-submenu">
    <a href="produtos.html">produtos</a>
    <li><a href="dashboard.html">Dashboard</a></li>
    <li><a href="sobre.html">Sobre</a></li>

    </div>
     </ul>
     <button id="abrirCarrinho" class="carrinho-botao">🛒 Carrinho (<span id="contadorCarrinho">0</span>)</button>
  </nav>

      <section class="produtos">
      <h2>Produtos</h2>
      <div class="controles-produtos">
<input id="buscaProduto"
type="search"
placeholder="Buscar produto...">
<select id="filtroCategoria">
<option value="todos">Todas as categorias</option>
<option value="garrafa 500ml">garrafa-500ml</option>
<option value="garrafa 750ml">garrafa-750ml</option>
<option value="garrafa 800ml">garrafa-800ml</option>

</select>
<select id="ordenarProdutos">
<option value="padrao">Ordem padrao</option>
<option value="menor-preco">Menor preco</option>
<option value="maior-preco">Maior preco</option>
</select>
</div>
      <div class="produtos-grid">
        
       <article class="produto-card"
       data-id="1"
       data-nome="garrafa-500ml"
       data-preco="25.00">
       <img src="img/produto1.webp" alt="Produto 2">
          <h3>Garrafa termica 500ml</h3>
          <p>Custo medio</p>
          <div class="preco">R$ 25,00</div>
      <button class="btn-adicionar">Adicionar</button>
      
     </article>

     
      
     <article class="produto-card"
      data-id="2"   
      data-nome="garrafa-750ml"
      data-preco="35.00">
          <img src="img/produto2.webp" alt="Produto 2">
          <h3>Garrafa termica 750ml</h3>
          <p>Custo medio</p>
          <div class="preco">R$ 35,00</div>
       <button class="btn-adicionar">Adicionar</button>
     </article>



        <article class="produto-card"
         data-id="3"
         data-nome="garrafa-800ml"
         data-preco="50.00">
          <img src="img/produto3.webp" alt="Produto 3">
          <h3>Garrafa termica 800ml</h3>
          <p>mais armazenamento de agua e qualidade boa.</p>
          <div class="preco">R$ 50,00</div>
          <button class="btn-adicionar">Adicionar</button>
        </article>

        </div>

      </div>
      <div>
    </section>


<div class="modal-overlay" id="modalProduto">
<div class="modal">
<button type="button" id="fecharModal">Fechar</button>
<h2 id="modalTitulo"></h2>
<p id="modalDescricao"></p>
</div>
</div>

<div class="carrinho-overlay" id="carrinhoOverlay"></div>
<aside class="carrinho-painel" id="carrinhoPainel"
aria-label="Carrinho de compras">
<div class="carrinho-topo">
<h2>Meu carrinho</h2>
<button id="fecharCarrinho" type="button">Fechar</button>
</div>
<div id="carrinhoLista"></div>
<div class="carrinho-resumo">
<strong>Total:</strong>
<span id="totalCarrinho">R$ 0,00</span>
</div>
<button class="btn btn-principal"
id="finalizarPedido"
type="button">
Finalizar pedido
</button>
</aside>

<button id="voltarTopo" class="voltar-topo" type="button">
Topo
</button>
</body>
</html>
